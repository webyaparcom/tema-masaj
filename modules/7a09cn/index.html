<section class="modulex-iletisim-form-harita{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-iletisim-form-harita-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* iletisim-form-harita — contact-7'nin form + harita içeriğini iki eşit sütunda verir: harita süs değil sütunun yarısı, kanallar küçük çiplerle haritanın altında. */
  .modulex-iletisim-form-harita { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-iletisim-form-harita *, .modulex-iletisim-form-harita *::before, .modulex-iletisim-form-harita *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-iletisim-form-harita :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-iletisim-form-harita :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-iletisim-form-harita :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-iletisim-form-harita :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-iletisim-form-harita img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-iletisim-form-harita) img { height: auto; }
  .modulex-iletisim-form-harita [hidden] { display: none !important; }
  .modulex-iletisim-form-harita :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-iletisim-form-harita :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-iletisim-form-harita-ic { max-width: --max--; margin-inline: auto; }
  .modulex-iletisim-form-harita-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-iletisim-form-harita--bassiz .modulex-iletisim-form-harita-bas { display: none; }
  .modulex-iletisim-form-harita-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-iletisim-form-harita-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-iletisim-form-harita-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-iletisim-form-harita-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-iletisim-form-harita-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-iletisim-form-harita-dugme:hover { transform: translateY(-2px); }
  .modulex-iletisim-form-harita-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-iletisim-form-harita-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-iletisim-form-harita-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-iletisim-form-harita-duzen { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 64px); align-items: stretch; }
  .modulex-iletisim-form-harita-sol { display: grid; align-content: start; gap: 16px; }
  .modulex-iletisim-form-harita-sol .modulex-iletisim-form-harita-form { margin-block-start: 12px; }
  .modulex-iletisim-form-harita-sag { display: grid; grid-template-rows: minmax(360px, 1fr) auto; gap: 16px; }
  .modulex-iletisim-form-harita-sag .modulex-iletisim-form-harita-harita { min-height: 360px; }
  .modulex-iletisim-form-harita-kanallar { display: flex; flex-wrap: wrap; gap: 10px; }
  .modulex-iletisim-form-harita-kc { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 16px; border: 1px solid --cizgi--; border-radius: 999px; background: --kartBg--; max-width: 100%; }
  .modulex-iletisim-form-harita-kci { color: --accentInk--; font-size: 20px; }
  .modulex-iletisim-form-harita-kc .modulex-iletisim-form-harita-deger { font-weight: 600; }
  @media (max-width: 1024px) {
    .modulex-iletisim-form-harita-duzen { grid-template-columns: minmax(0, 1fr); }
    .modulex-iletisim-form-harita-sag { grid-template-rows: auto auto; }
    .modulex-iletisim-form-harita-sag .modulex-iletisim-form-harita-harita { min-height: 300px; }
  }
  .modulex-iletisim-form-harita-kikon { flex: none; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; font-size: 24px; }
  .modulex-iletisim-form-harita-ketiket { display: block; color: --muted--; font-size: 0.82rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
  .modulex-iletisim-form-harita-deger { color: inherit; font-weight: 650; text-decoration: none; overflow-wrap: anywhere; transition: color 0.2s ease; }
  a.modulex-iletisim-form-harita-deger:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-iletisim-form-harita-eylem { display: inline-flex; align-items: center; gap: 6px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.2s ease; }
  .modulex-iletisim-form-harita-eylem:hover { gap: 10px; }
  .modulex-iletisim-form-harita-eylem .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-form-harita-kopya { display: none; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: --text--; font: inherit; font-size: 0.85rem; font-weight: 650; transition: border-color 0.2s ease, background 0.2s ease; }
  .modulex-iletisim-form-harita--kjs .modulex-iletisim-form-harita-kopya { display: inline-flex; }
  .modulex-iletisim-form-harita-kopya:hover { border-color: --accent--; }
  .modulex-iletisim-form-harita-kopya .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-form-harita--kopyalandi { background: color-mix(in srgb, --accent-- 14%, transparent); }
  .modulex-iletisim-form-harita-sosyal { display: grid; gap: 10px; }
  .modulex-iletisim-form-harita-sbaslik { color: --muted--; font-size: 0.9rem; font-weight: 650; }
  .modulex-iletisim-form-harita-sliste { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-iletisim-form-harita-cip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-weight: 650; text-decoration: none; transition: border-color 0.2s ease, transform 0.2s ease; }
  .modulex-iletisim-form-harita-cip:hover { border-color: --accent--; transform: translateY(-2px); }
  .modulex-iletisim-form-harita-cikon { font-size: 18px; }
  .modulex-iletisim-form-harita-harita { position: relative; overflow: hidden; min-height: 280px; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-iletisim-form-harita-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modulex-iletisim-form-harita-hdesen { position: absolute; inset: 0; display: grid; place-items: center; background-color: color-mix(in srgb, --accent-- 8%, --kartBg--); background-image: linear-gradient(color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), radial-gradient(circle at 30% 40%, color-mix(in srgb, --accent-- 18%, transparent) 0 18%, transparent 19%); background-size: 36px 36px, 36px 36px, 100% 100%; }
  .modulex-iletisim-form-harita-pin { color: --accentInk--; font-size: 56px; animation: modulex-iletisim-form-harita-zipla 2.4s ease-in-out infinite; }
  @keyframes modulex-iletisim-form-harita-zipla { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .modulex-iletisim-form-harita-hyol { position: absolute; inset-block-end: 16px; inset-inline-start: 16px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 999px; background: --bg--; color: --text--; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px color-mix(in srgb, --text-- 16%, transparent); transition: transform 0.2s ease; }
  .modulex-iletisim-form-harita-hyol:hover { transform: translateY(-2px); }
  .modulex-iletisim-form-harita-hyol .material-symbols-outlined { font-size: 18px; color: --accentInk--; }

  .modulex-iletisim-form-harita-form { display: grid; gap: 18px; }
  .modulex-iletisim-form-harita-fbaslik { font-size: 1.3rem; font-weight: 750; }
  .modulex-iletisim-form-harita-alanlar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .modulex-iletisim-form-harita-alan { display: flex; flex-direction: column-reverse; gap: 6px; }
  .modulex-iletisim-form-harita-alan--genis { grid-column: 1 / -1; }
  .modulex-iletisim-form-harita-etiket { font-size: 0.9rem; font-weight: 650; }
  .modulex-iletisim-form-harita-girdi { width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid color-mix(in srgb, currentColor 26%, transparent); border-radius: 12px; background: color-mix(in srgb, currentColor 4%, transparent); color: inherit; font: inherit; transition: border-color 0.2s ease, box-shadow 0.2s ease; }
  textarea.modulex-iletisim-form-harita-girdi { min-height: 132px; resize: vertical; }
  .modulex-iletisim-form-harita-girdi:focus { outline: none; border-color: --accent--; box-shadow: 0 0 0 3px color-mix(in srgb, --accent-- 28%, transparent); }
  .modulex-iletisim-form-harita-secim { cursor: pointer; }
  .modulex-iletisim-form-harita-secim option { background: --bg--; color: --text--; }
  .modulex-iletisim-form-harita-onay { display: flex; gap: 10px; align-items: flex-start; font-size: 0.92rem; }
  .modulex-iletisim-form-harita-onay input { flex: none; width: 20px; height: 20px; margin-block-start: 2px; accent-color: --accent--; cursor: pointer; }
  .modulex-iletisim-form-harita-onay a { color: inherit; font-weight: 700; text-underline-offset: 3px; }
  .modulex-iletisim-form-harita-gonder { justify-self: start; font: inherit; font-weight: 700; cursor: pointer; }
  .modulex-iletisim-form-harita-gonder:disabled { opacity: 0.6; cursor: progress; }
  .modulex-iletisim-form-harita-durum { min-height: 1.5em; font-size: 0.95rem; font-weight: 650; }
  .modulex-iletisim-form-harita-durum:empty { display: none; }
  .modulex-iletisim-form-harita-durum--hata { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .modulex-iletisim-form-harita-bal { position: absolute; inset-inline-start: -9999px; width: 1px; height: 1px; overflow: hidden; }
  @media (max-width: 768px) {
    .modulex-iletisim-form-harita-alanlar { grid-template-columns: minmax(0, 1fr); }
    .modulex-iletisim-form-harita-gonder { justify-self: stretch; justify-content: center; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-form-harita :is(.modulex-iletisim-form-harita-baslik, .modulex-iletisim-form-harita-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-form-harita-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-iletisim-form-harita { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-iletisim-form-harita *, .modulex-iletisim-form-harita *::before, .modulex-iletisim-form-harita *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-iletisim-form-harita";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const form = (s, P) => {
        s.querySelectorAll("form[data-fb-form]").forEach((f) => {
          const durum = f.querySelector("[role=status]");
          const yaz = (m, hata) => { if (durum) { durum.textContent = m || ""; durum.classList.toggle(P + "-durum--hata", !!hata); } };
          let t0 = Date.now();
          const al = (ad) => { const e = f.elements.namedItem(ad); return e && "value" in e ? String(e.value).trim() : ""; };
          const etiket = (ad) => { const e = f.elements.namedItem(ad); const l = e && e.id ? f.querySelector(`label[for="${e.id}"]`) : null; return l ? l.textContent.trim() : ad; };
          const konuMetin = () => { const e = f.elements.namedItem("topic"); return e && e.selectedIndex > 0 ? e.options[e.selectedIndex].text.trim() : ""; };
          f.addEventListener("submit", (e) => {
            e.preventDefault();
            if (!f.checkValidity()) { f.reportValidity(); return; }
            if (al("website")) return;
            const govde = ["name", "email", "phone"].filter(al).map((k) => `${etiket(k)}: ${al(k)}`)
              .concat(konuMetin() ? [`${etiket("topic")}: ${konuMetin()}`] : [], al("message") ? ["", al("message")] : []).join("\n");
            const d = f.dataset;
            if (d.action) {
              const b = f.querySelector("[type=submit]");
              if (b) b.disabled = true;
              const yuk = { name: al("name"), email: al("email"), phone: al("phone"), topic: konuMetin(), message: al("message"), kvkk: true, lang: document.documentElement.lang || "", page: location.pathname, website: al("website"), t: Date.now() - t0 };
              fetch(d.action, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(yuk) })
                .then((r) => r.json().catch(() => ({})).then((j) => r.ok && j && j.ok !== false))
                .then((ok) => { if (b) b.disabled = false; yaz(ok ? d.ok : d.hata, !ok); if (ok) { f.reset(); t0 = Date.now(); } })
                .catch(() => { if (b) b.disabled = false; yaz(d.hata, true); });
              return;
            }
            if (d.gonderim === "whatsapp" && d.wa) { window.open(`https://wa.me/${d.wa}?text=${encodeURIComponent(govde)}`, "_blank", "noopener"); return; }
            if (d.eposta) {
              const konu = [d.konu || "", konuMetin()].filter(Boolean).join(" - ");
              location.href = `mailto:${d.eposta}?subject=${encodeURIComponent(konu)}&body=${encodeURIComponent(govde.replace(/\n/g, "\r\n"))}`;
            }
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      form(s, P, az);
    });
  })();
</script>
