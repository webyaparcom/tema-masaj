<section class="modulex-cagri-sohbet{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-cagri-sohbet-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* cagri-sohbet — Konuşma metaforu — çağrı bir diyaloğun sorusu, düğmeler yanıtlar. */
  .modulex-cagri-sohbet { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --yaziRenk--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-cagri-sohbet *, .modulex-cagri-sohbet *::before, .modulex-cagri-sohbet *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-cagri-sohbet :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-cagri-sohbet :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-cagri-sohbet :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-cagri-sohbet :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-cagri-sohbet img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-cagri-sohbet) img { height: auto; }
  .modulex-cagri-sohbet [hidden] { display: none !important; }
  .modulex-cagri-sohbet :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-cagri-sohbet :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-cagri-sohbet-ic { max-width: --max--; margin-inline: auto; }
  .modulex-cagri-sohbet-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-cagri-sohbet--bassiz .modulex-cagri-sohbet-bas { display: none; }
  .modulex-cagri-sohbet-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-cagri-sohbet-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-cagri-sohbet-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-cagri-sohbet-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-cagri-sohbet-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-cagri-sohbet-dugme:hover { transform: translateY(-2px); }
  .modulex-cagri-sohbet-dugme--ikincil { background: transparent; color: --yaziRenk--; border-color: --cizgi--; }
  .modulex-cagri-sohbet-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-cagri-sohbet-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-cagri-sohbet-akis { display: grid; gap: 12px; }
  .modulex-cagri-sohbet-kim { color: --muted--; font-size: 0.85rem; font-weight: 700; }
  .modulex-cagri-sohbet-balon { justify-self: start; max-width: min(92%, 640px); padding: 18px 22px; border-radius: 24px; border-end-start-radius: 6px; background: --kartBg--; box-shadow: 0 10px 24px -20px color-mix(in srgb, --yaziRenk-- 60%, transparent); transition: opacity 0.5s ease, transform 0.5s ease; }
  .modulex-cagri-sohbet-bbas { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.4rem, 2.6vw, 2rem); font-weight: 750; line-height: 1.2; }
  .modulex-cagri-sohbet-bmetin { color: --muted--; }
  .modulex-cagri-sohbet-yanit { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-block-start: 8px; transition: opacity 0.5s ease 0.5s, transform 0.5s ease 0.5s; }
  .modulex-cagri-sohbet-cip { padding: 12px 20px; border: 2px solid --accent--; border-radius: 999px; border-end-end-radius: 6px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease; }
  .modulex-cagri-sohbet-cip--ikincil { background: transparent; color: --accentInk--; }
  .modulex-cagri-sohbet-cip:hover { transform: translateY(-2px); }
  .modulex-cagri-sohbet-balon--2 { transition-delay: 0.25s; }
  .modulex-cagri-sohbet--hazir:not(.modulex-cagri-sohbet--gor) :is(.modulex-cagri-sohbet-balon, .modulex-cagri-sohbet-yanit) { opacity: 0; transform: translateY(12px); }
  .modulex-cagri-sohbet-wasvg { width: 1.25em; height: 1.25em; flex: none; }
  .modulex-cagri-sohbet-maddeler { display: grid; gap: 12px; }
  .modulex-cagri-sohbet-madde { display: flex; align-items: flex-start; gap: 12px; }
  .modulex-cagri-sohbet-mikon { flex: none; color: --accentInk--; font-size: 24px; }
  .modulex-cagri-sohbet-myazi { display: grid; gap: 2px; }
  .modulex-cagri-sohbet-myazi strong { font-weight: 700; }
  .modulex-cagri-sohbet-myazi small { color: --muted--; font-size: 0.92rem; }
  .modulex-cagri-sohbet-not { color: --muted--; font-size: 0.9rem; }
  .modulex-cagri-sohbet-saat { display: flex; align-items: center; gap: 8px; color: --muted--; font-size: 0.95rem; }
  .modulex-cagri-sohbet-saat .material-symbols-outlined { font-size: 20px; color: --accentInk--; }
  .modulex-cagri-sohbet-metin { max-width: 62ch; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-cagri-sohbet :is(.modulex-cagri-sohbet-baslik, .modulex-cagri-sohbet-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-cagri-sohbet-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-cagri-sohbet { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-cagri-sohbet *, .modulex-cagri-sohbet *::before, .modulex-cagri-sohbet *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-cagri-sohbet";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
